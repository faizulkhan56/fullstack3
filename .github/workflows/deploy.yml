name: Deploy Fullstack App

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Stop existing containers
        run: |
          docker-compose down || true

      - name: Build and Start containers
        run: |
          docker-compose up -d --build

      - name: Show running containers
        run: docker ps

